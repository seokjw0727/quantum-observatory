<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A weekly view of quantum computing and quantum information research. Explore papers, conference contributions, reports, and transparent research trends."
    />
    <meta name="theme-color" content="#f9fafb" />
    <title>Quantum Observatory — Weekly research</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Quantum Observatory home"
          ><span class="brand-mark" aria-hidden="true">q.</span
          ><span>Quantum <strong>Observatory</strong></span></a
        >
        <nav aria-label="Main navigation">
          <a href="/" data-page="overview">Overview</a>
          <a href="/research/" data-page="research">Research</a>
          <a href="/archive/" data-page="archive">Archive</a>
          <a href="/methodology/" data-page="methodology">Methodology</a>
        </nav>
        <button
          id="theme-toggle"
          class="icon-button"
          aria-label="Toggle color theme"
          title="Toggle color theme"
        >
          ◐
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="app" aria-busy="true">
        <div class="loading-state">
          <span class="eyebrow">QUANTUM OBSERVATORY</span>
          <h1>Loading research</h1>
          <p>Preparing the latest published snapshot.</p>
        </div>
      </div>
      <noscript
        ><p class="notice">
          Enable JavaScript to search and explore this research dashboard.
          <a href="/data/summary.json">Download the weekly statistics</a>.
        </p></noscript
      >
    </main>
    <footer class="site-footer">
      <span>Quantum computing. Quantum information.</span
      ><span
        >Updated weekly ·
        <a href="/methodology/">Sources & methodology</a></span
      >
    </footer>
    <dialog id="detail-dialog" aria-labelledby="detail-title">
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>
